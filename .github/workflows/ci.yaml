name: ci

on:
  push:
    paths:
      - src/**
    branch:
      - master

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - 
        name: Set short git SHA
        id: vars
        run: echo "SHORT_SHA=$(echo ${GITHUB_SHA:0:6})" >> $GITHUB_ENV
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: yvitex7/python-app:${{ env.SHORT_SHA }}
  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      - 
        name: Install ArgoCD CLI
        run: |
          mkdir -p $HOME/.local/bin
          curl -sSL -o $HOME/.local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x $HOME/.local/bin/argocd
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      -
        name: ArgoCD App Sync
        shell: bash
        run: |
          argocd login argocd-server.argocd.svc.cluster.local:443 \
          --insecure \
          --grpc-web \
          --username admin \
          --password ${{secrets.ARGOCD_PASSWORD}}
          argocd app sync